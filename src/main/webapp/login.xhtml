<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Inicio de Sesión</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-panel { width: 350px; }
        .ui-panel-titlebar { background: #007bff; color: white; }
    </style>
</h:head>
<h:body>
    <h:form id="loginForm">
        <p:panel header="Iniciar Sesión" styleClass="login-panel">
            <p:messages id="messages" showDetail="true" closable="true">
                <p:autoUpdate/>
            </p:messages>
            
            <h:panelGrid columns="2" cellpadding="5">
                <p:outputLabel for="username" value="Usuario:"/>
                <p:inputText id="username" value="#{loginBean.username}" required="true" requiredMessage="El usuario es obligatorio"/>

                <p:outputLabel for="password" value="Contraseña:"/>
                <p:password id="password" value="#{loginBean.password}" required="true" requiredMessage="La contraseña es obligatoria"/>
            </h:panelGrid>

            <p:commandButton value="Entrar" action="#{loginBean.login}" update="loginForm:messages" style="margin-top: 10px;"/>
        </p:panel>
    </h:form>
</h:body>
</html>
